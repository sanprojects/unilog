[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unilog"
version = "1.0.1"
description = "Zero-config OTel-shaped structured logging for Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
unilog-enable-pth = "unilog._pth_install:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
unilog = ["py.typed"]
